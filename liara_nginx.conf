# RunFlare / Liara — nginx serves collected static; Django handles SPA/API
client_max_body_size 100M;

# RunFlare collectstatic writes to /app/staticfiles (Liara default: /usr/src/app/staticfiles)
location /static/ {
  alias /app/staticfiles/;
  expires 30d;
  add_header Cache-Control "public, immutable";
}

location /media/ {
  alias /app/media/;
}

location / {
  try_files /dev/null @django_app;
}

location ~\.sqlite3$ {
  deny all;
  error_page 403 =404 /;
}

location ~ /\.well-known {
  allow all;
}
